<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Email Verifier</title>
    <meta name="description" content="Sign in to the self-hosted bulk email verifier.">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>try{var m=localStorage.getItem('theme')||'system';var d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}catch(e){}</script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="auth">
        <div class="auth-card">
            <div class="auth-head">
                <img src="/favicon.svg" alt="">
                <h1>Email Verifier</h1>
                <p>Sign in to your self-hosted instance</p>
            </div>

            <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
                <div class="field">
                    <label class="label" for="email">Email</label>
                    <input class="input" type="email" id="email" name="email" autocomplete="username" required autofocus placeholder="you@example.com">
                </div>
                <div class="field">
                    <label class="label" for="password">Password</label>
                    <input class="input" type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password">
                </div>
                <button class="btn primary block" type="submit" style="margin-top:4px">Sign in</button>
            </form>

            <div class="auth-foot">
                Registration is disabled — accounts live in the database
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/index.js"></script>
</body>
</html>
