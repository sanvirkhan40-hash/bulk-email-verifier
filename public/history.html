<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History · Email Verifier</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>try{var m=localStorage.getItem('theme')||'system';var d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')}catch(e){}</script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <a class="brand" href="/dashboard.html">
            <img src="/favicon.svg" alt="">
            <div>
                <div class="brand-name">Email Verifier</div>
                <div class="brand-sub">Bulk verification</div>
            </div>
        </a>
        <nav class="side-nav">
            <a class="side-link" data-path="/dashboard.html" href="/dashboard.html"><i class="fa-solid fa-chart-pie"></i>Dashboard</a>
            <a class="side-link" data-path="/single.html" href="/single.html"><i class="fa-solid fa-magnifying-glass"></i>Single verify</a>
            <a class="side-link" data-path="/bulk.html" href="/bulk.html"><i class="fa-solid fa-file-csv"></i>Bulk verify</a>
            <a class="side-link" data-path="/history.html" href="/history.html"><i class="fa-solid fa-clock-rotate-left"></i>History</a>
            <div class="side-sep"></div>
            <a class="side-link" data-path="/settings.html" href="/settings.html"><i class="fa-solid fa-gear"></i>Settings</a>
        </nav>
        <div class="side-foot">
            <div class="side-link" style="cursor:default"><i class="fa-solid fa-user"></i><span id="userNameDisplay">Signed in</span></div>
            <button class="side-link" id="themeBtn"><i class="fa-solid fa-moon"></i>Theme</button>
            <button class="side-link danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>Log out</button>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1>History</h1>
            <div class="spacer"></div>
            <div class="quick">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="quickEmail" type="email" placeholder="Quick verify an email…">
                <button id="quickGo">Verify</button>
            </div>
            <button class="btn sm icon" id="paletteBtn" title="Command palette (Ctrl+K)"><i class="fa-solid fa-terminal"></i></button>
        </header>

        <div class="page">
            <div class="page-head">
                <div>
                    <h2>Everything you have checked</h2>
                    <p>Individual checks and saved bulk runs.</p>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-head">
                    <h3>Recent checks</h3>
                    <div class="spacer"></div>
                    <input class="input sm" id="searchInput" placeholder="Search email…" style="max-width:220px">
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr><th>Email</th><th>Status</th><th>Checked by</th><th>Source</th><th>When</th></tr>
                        </thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
                <div class="card-foot d-flex justify-content-between align-items-center d-none" id="paginationControls">
                    <button class="btn sm" id="prevBtn"><i class="fa-solid fa-chevron-left"></i>Previous</button>
                    <span class="small text-muted">Page <span id="pageSpan">1</span> of <span id="totalPagesSpan">1</span></span>
                    <button class="btn sm" id="nextBtn">Next<i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="card">
                <div class="card-head">
                    <h3>Saved bulk runs</h3>
                    <div class="spacer"></div>
                    <button class="btn sm" id="exportSelectedValidBtn"><i class="fa-solid fa-check"></i>Export valid</button>
                    <button class="btn sm" id="exportSelectedAllBtn"><i class="fa-solid fa-download"></i>Export all</button>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width:36px"><input type="checkbox" class="form-check-input" id="selectAllJobsCheckbox"></th>
                                <th>File</th>
                                <th>Total</th>
                                <th>Valid</th>
                                <th>Invalid</th>
                                <th>When</th>
                                <th class="right">Download</th>
                            </tr>
                        </thead>
                        <tbody id="jobsBody"></tbody>
                    </table>
                </div>
                <div class="card-foot">
                    <button class="btn sm ghost" id="selectAllJobsBtn"><i class="fa-solid fa-list-check"></i>Select all runs</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/js/app.js?v=5"></script>
<script src="/js/csv-export.js?v=7"></script>
<script src="/js/pages/history.js?v=7"></script>
</body>
</html>
